name: Deploy Frontend and Backend to cPanel

on:
  push:
    branches:
      - main

jobs:
  # 1. FRONTEND DEPLOYMENT (techla.lk -> public_html)
  deploy-frontend:
    name: Build & Deploy Frontend (techla.lk)
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: 🔨 Build Frontend Bundle
        working-directory: frontend
        run: npm run build

      - name: 🚀 Sync Frontend to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: frontend/dist/
          server-dir: public_html/
          dangerous-clean-slate: false

  # 2. BACKEND DEPLOYMENT (techlabackend.techla.lk)
  deploy-backend:
    name: Deploy Backend API (techlabackend.techla.lk)
    runs-on: ubuntu-latest
    needs: deploy-frontend
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Backend & Generate Prisma
        working-directory: backend
        run: |
          npm install
          npx prisma generate

      - name: 🚀 Sync Backend to Subdomain Folder
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: backend/
          server-dir: techlabackend.techla.lk/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
